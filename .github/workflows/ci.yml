name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# Отменяем предыдущие запуски при новом push в ту же ветку
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Фейковый DATABASE_URL на уровне всего workflow.
# Нужен, потому что postinstall пакета @swift/db запускает prisma generate,
# а prisma.config.ts требует переменную DATABASE_URL через env().
# Сама генерация клиента НЕ подключается к базе и этот url не использует —
# значение чисто формальное, чтобы env() не падал с ошибкой Cannot resolve.
# Реальный DATABASE_URL появится здесь позже, когда добавим job с Postgres.
env:
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"

jobs:
  lint-and-typecheck:
    name: Lint and Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

      - name: Run typecheck
        run: bun run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all packages
        run: bun run build

# ЗАМЕТКА НА БУДУЩЕЕ:
# Job test с реальным Postgres + Redis и настоящим DATABASE_URL добавится,
# когда появятся тесты с базой.
