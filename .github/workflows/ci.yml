name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# Отменяем предыдущие запуски при новом push в ту же ветку (экономим минуты Actions)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: 🧹 Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

      - name: Run typecheck
        run: bun run typecheck

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all packages
        run: bun run build

# ─────────────────────────────────────────────────────────────────────────────
#  ЗАМЕТКА НА БУДУЩЕЕ:
#  Job 'test' с Postgres + Redis + миграциями Prisma будет добавлен,
#  когда появится пакет @swift/db и первые тесты (фаза работы с БД).
#  Job 'e2e' с Playwright — когда появится apps/web с UI.
#  Не добавляем их сейчас, чтобы CI проверял только реально существующий код.
